[package]
name = "xq-sync"
version = "0.1.0"
edition = "2021"
description = "Sync mirroring cho game Co Tuong: Firebase Auth + Firestore qua REST. Pure logic, khong dinh Iced."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# v4 cần RNG: desktop dùng OS RNG; wasm dùng `crypto.getRandomValues`
# qua feature `js` của getrandom (xem `uuid` docs).
uuid = { version = "1", features = ["v4"] }

# Desktop only: ureq + rustls (TCP + TLS). Trên wasm không có socket
# — transport là `fetch` (gloo-net) ở phía xq-iced, dùng chung phần
# pure của crate này (model / conflict / firestore URL + parse).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5.2", features = ["json"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }

[dev-dependencies]
