<!-- Lucide-style "arrow-left" icon extracted from the Iced design mockup
     (~/workspace/user/files/C__t__ng___Thi_t_k__giao_di_n__iced.html, pages dtpl_2.html, dtpl_3.html, dtpl_4.html, dtpl_5.html, dtpl_6.html).
     Original markup: viewBox 0 0 24 24, fill="none", stroke="currentColor",
     stroke-width 2, round caps/joins. stroke is baked to #ECE7DC (theme TEXT)
     because iced's Svg renderer has no inherited currentColor: usvg would
     resolve currentColor to black on the dark theme. Tint at use site with
     `.style(|_, _| iced::widget::svg::Style { color: Some(...) })` — the
     style colour repaints the whole icon, ignoring this baked colour. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ECE7DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <path d="M19 12H5"></path><path d="m12 19-7-7 7-7"></path>
</svg>
