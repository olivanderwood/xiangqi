[package]
name = "xq-chessdb"
version = "0.1.0"
edition = "2021"
description = "ChessDB cloud database client — a separate live scoring system for the Xiangqi app"
license = "MIT"

[dependencies]
# No HTTP client dependency: the client speaks plain HTTP/1.1 over
# `std::net::TcpStream` directly (see `http_get`). ChessDB is plain
# HTTP, and the app must not crash on Windows when the network is up
# — the previous `ureq` client was implicated in a 0xc0000409
# (STATUS_STACK_BUFFER_OVERRUN) crash on entering either board
# screen whenever the network was available (offline = no crash,
# Hieu, 2026-11-12). A minimal hand-rolled client leaves nothing
# outside this crate to go wrong.
