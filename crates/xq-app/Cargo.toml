[package]
name = "xq-app"
version = "0.1.0"
edition = "2021"
description = "Xiangqi AI game — desktop GUI (eframe/egui)"
license = "MIT"

[[bin]]
name = "xiangqi"
path = "src/main.rs"

[dependencies]
xq-core = { path = "../xq-core" }
xq-book = { path = "../xq-book" }
xq-engine = { path = "../xq-engine" }
xq-pikafish = { path = "../xq-pikafish" }
xq-chessdb = { path = "../xq-chessdb" }
eframe = { version = "0.31", features = ["persistence"] }
egui = "0.31"
# Image loaders for the practice screen's board-photo upload (Hieu,
# 2026-11-12): egui 0.31 ships no raster decoder; without this the
# photo shows only a placeholder.
egui_extras = { version = "0.31", features = ["image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
# Sound effects (Hieu, 2026-11-12): tones are synthesized in code
# (`sound.rs`), no audio files. Linux needs ALSA dev (present on VM).
rodio = "0.21"

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["eframe"] }
ttf-parser = "0.25"

# Windows-only: embed icon + version info into xiangqi.exe (spec 9.2).
# The build script no-ops on other platforms.
[build-dependencies]
winresource = "0.1"
