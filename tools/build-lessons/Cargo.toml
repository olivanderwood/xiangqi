[package]
name = "build-lessons"
version = "0.1.0"
edition = "2021"
description = "CLI: build per-ECCO opening trees + main lines from VietCoTuong games (games.jsonl) for the Learn-mode book"
license = "MIT"

[[bin]]
name = "build-lessons"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xq-core = { path = "../../crates/xq-core" }
