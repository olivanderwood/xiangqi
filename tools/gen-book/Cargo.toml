[package]
name = "gen-book"
version = "0.1.0"
edition = "2021"
description = "CLI: regenerate the opening book (openings.json) from Pikafish"
license = "MIT"

[[bin]]
name = "gen-book"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xq-core = { path = "../../crates/xq-core" }
xq-book = { path = "../../crates/xq-book" }
xq-engine = { path = "../../crates/xq-engine" }
xq-pikafish = { path = "../../crates/xq-pikafish" }
