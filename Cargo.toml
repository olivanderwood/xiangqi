[workspace]
members = ["crates/xq-core", "crates/xq-book", "crates/xq-engine", "crates/xq-pikafish", "crates/xq-chessdb", "crates/xq-app", "tools/book-check", "tools/gen-book", "tools/build-lessons"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
